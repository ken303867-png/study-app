name: Sync App Version Tests

on:
  push:
    branches:
      - fix/common-final-explanations-v1.3
    paths:
      - .github/workflows/sync-app-version-tests.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/common-final-explanations-v1.3
      - name: Update E2E app version assertions
        run: |
          grep -rl "学習アプリ v0.20.1" tests/e2e | xargs -r sed -i "s/学習アプリ v0\.20\.1/学習アプリ v0.20.2/g"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-app-version-tests.yml
          git add tests/e2e
          git commit -m "v0.20.2へE2E期待値を更新"
          git push origin HEAD:fix/common-final-explanations-v1.3
