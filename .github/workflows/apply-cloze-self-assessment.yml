name: Apply cloze self-assessment patch

on:
  push:
    paths:
      - '.github/workflows/apply-cloze-self-assessment.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply cloze self-assessment patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply codemod
        run: node scripts/apply-cloze-self-assessment.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PracticeMode.tsx src/components/PracticeSetBuilder.tsx src/styles.css tests/unit/PracticeMode.clozeSelfAssessment.test.tsx
          git commit -m "feat: add cloze answer reveal self-assessment"
          git push
