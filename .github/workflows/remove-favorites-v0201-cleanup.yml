name: Favorite removal cleanup v0.20.1

on:
  push:
    branches:
      - hotfix/v0.20.1-remove-favorites

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.20.1-remove-favorites
          fetch-depth: 0
      - name: Clean public wording and inspect tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text()
          old = '学習履歴・試験履歴・お気に入り・要復習状態はこの端末だけに保存されます。'
          new = '学習履歴・試験履歴・要復習状態はこの端末だけに保存されます。'
          if old not in text:
              raise SystemExit('Expected App favorite wording not found')
          p.write_text(text.replace(old, new))
          PY
          echo '=== remaining favorite references in src (legacy compatibility only expected) ==='
          git grep -nE 'favorite|お気に入り' -- src || true
          echo '=== favorite references in tests ==='
          git grep -nE 'favorite|お気に入り' -- tests || true
      - name: Commit cleanup
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: remove favorite wording from public learner copy"
          git push origin HEAD:hotfix/v0.20.1-remove-favorites
