name: Refine Common Final Explanations

on:
  push:
    branches:
      - fix/common-final-explanations-v1.3
    paths:
      - scripts/refine-common-final-explanations.mjs
      - .github/workflows/refine-common-final-explanations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/common-final-explanations-v1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: node scripts/refine-common-final-explanations.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:public-data
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Commit generated refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/public-data/manifest.json public/public-data/common-final-2026-v1.3 src/components/StudyContentCards.tsx src/App.tsx tests/unit/StudyContentCards.finalExplanation.test.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "最終対策200問の解説品質と穴抜き表示を修正"
          git push origin HEAD:fix/common-final-explanations-v1.3
