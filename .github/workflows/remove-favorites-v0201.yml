name: Remove favorites v0.20.1

on:
  push:
    branches:
      - hotfix/v0.20.1-remove-favorites

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.20.1-remove-favorites
          fetch-depth: 0
      - name: Remove favorite feature
        shell: python
        run: |
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              text = p.read_text()
              new = fn(text)
              if new == text:
                  raise SystemExit(f'No change produced for {path}')
              p.write_text(new)

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text: {label}')
              return text.replace(old, new)

          edit('src/components/LearningStateControls.tsx', lambda s: repl(repl(repl(
              s,
              '  onToggleFavorite,\n', '', 'LearningStateControls destructure'),
              '  onToggleFavorite: () => void;\n', '', 'LearningStateControls type'),
              '''        <button type="button" aria-pressed={history.favorite} onClick={onToggleFavorite}>\n          {history.favorite ? 'お気に入り ★' : 'お気に入り ☆'}\n        </button>\n''', '', 'LearningStateControls favorite button'))

          edit('src/components/StudyContentCards.tsx', lambda s: repl(repl(repl(
              s,
              '  onToggleFavorite,\n', '', 'QuestionCard destructure'),
              '  onToggleFavorite: () => void;\n', '', 'QuestionCard type'),
              '        onToggleFavorite={onToggleFavorite}\n', '', 'QuestionCard pass-through'))

          edit('src/components/PracticeMode.tsx', lambda s: repl(repl(repl(
              s,
              '  onToggleFavorite,\n', '', 'PracticeMode destructure'),
              '  onToggleFavorite: (questionId: string) => Promise<void>;\n', '', 'PracticeMode type'),
              '''            <button\n              type="button"\n              aria-pressed={history?.favorite === true}\n              onClick={() => void onToggleFavorite(currentQuestion.id)}\n            >\n              {history?.favorite ? 'お気に入り ★' : 'お気に入り ☆'}\n            </button>\n''', '', 'PracticeMode favorite button'))

          def edit_app(s):
              s = repl(s, '''  const toggleFavorite = async (questionId: string) => {\n    replaceHistory(await learningRepository.toggleFavorite(questionId));\n  };\n\n''', '', 'App toggleFavorite')
              s = repl(s, '                    onToggleFavorite={() => void toggleFavorite(question.id)}\n', '', 'App QuestionCard favorite prop')
              s = repl(s, '            onToggleFavorite={toggleFavorite}\n', '', 'App PracticeMode favorite prop')
              return s
          edit('src/App.tsx', edit_app)

          def edit_practice_sets(s):
              for old, label in [
                  ("  'favorite',\n", 'favorite preset'),
                  ('  favorite: number;\n', 'favorite summary type'),
                  ('    favorite: questions.filter((question) => historyByQuestionId.get(question.id)?.favorite === true).length,\n', 'favorite summary'),
                  ("    case 'favorite':\n      return history?.favorite === true;\n", 'favorite matcher'),
              ]:
                  s = repl(s, old, '', label)
              return s
          edit('src/utils/practiceSets.ts', edit_practice_sets)

          def edit_builder(s):
              s = repl(s, "  favorite: 'お気に入り',\n", '', 'builder favorite label')
              s = repl(s, "    case 'favorite':\n      return summary.favorite;\n", '', 'builder favorite count')
              return s
          edit('src/components/PracticeSetBuilder.tsx', edit_builder)

          def edit_filters(s):
              s = repl(s, "  | 'favorite'\n", '', 'favorite filter type')
              s = repl(s, "  if (filter === 'favorite') return history?.favorite === true;\n", '', 'favorite filter matcher')
              return s
          edit('src/utils/contentFilters.ts', edit_filters)

          edit('src/components/QuestionFilterPanel.tsx', lambda s: repl(
              s, '            <option value="favorite">お気に入り</option>\n', '', 'favorite filter option'))

          def edit_analytics(s):
              for old, label in [
                  ('  favoriteQuestions: number;\n', 'favorite analytics type'),
                  ('  let favoriteQuestions = 0;\n', 'favorite analytics variable'),
                  ('    if (history.favorite) favoriteQuestions += 1;\n', 'favorite analytics increment'),
                  ('    favoriteQuestions,\n', 'favorite analytics return'),
              ]:
                  s = repl(s, old, '', label)
              return s
          edit('src/utils/learningAnalytics.ts', edit_analytics)

          edit('src/components/LearningDashboard.tsx', lambda s: repl(
              s,
              '<Metric label="未回答" value={`${overall.unansweredQuestions}問`} detail={`お気に入り ${overall.favoriteQuestions}問`} />',
              '<Metric label="未回答" value={`${overall.unansweredQuestions}問`} detail={`学習済み ${overall.answeredQuestions}問`} />',
              'dashboard favorite metric'))

          def edit_types(s):
              s = repl(s, '  favorite: boolean;\n  needsReview?: boolean;\n', '  /** @deprecated v0.20.1以降は使用しません。旧保存データ互換のためのみ許容します。 */\n  favorite?: boolean;\n  needsReview?: boolean;\n', 'LearningHistory favorite compatibility')
              s = repl(s, '  favorite: boolean;\n  viewed: boolean;\n', '  /** @deprecated v0.20.1以降は使用しません。旧保存データ互換のためのみ許容します。 */\n  favorite?: boolean;\n  viewed: boolean;\n', 'MaterialHistory favorite compatibility')
              return s
          edit('src/types/domain.ts', edit_types)

          def edit_repo(s):
              s = repl(s, '  toggleFavorite(questionId: string): Promise<LearningHistory>;\n', '', 'repository contract favorite')
              start = '''  async toggleFavorite(questionId: string): Promise<LearningHistory> {\n    return db.transaction('rw', db.learningHistory, async () => {\n      const current = await this.get(questionId);\n      const next: LearningHistory = { ...current, favorite: !current.favorite };\n      await db.learningHistory.put(next);\n      return next;\n    });\n  }\n\n'''
              s = repl(s, start, '', 'repository toggleFavorite method')
              s = repl(s, '        favorite: current.favorite,\n', '', 'reset favorite preservation')
              s = repl(s, '    favorite: false,\n', '', 'empty favorite')
              old = '''function normalizeHistory(history: LearningHistory): LearningHistory {\n  return {\n    ...history,\n    needsReview: history.needsReview ?? false\n  };\n}\n'''
              new = '''function normalizeHistory(history: LearningHistory): LearningHistory {\n  const normalized = { ...history };\n  delete normalized.favorite;\n  return {\n    ...normalized,\n    needsReview: normalized.needsReview ?? false\n  };\n}\n'''
              s = repl(s, old, new, 'normalize legacy favorite')
              return s
          edit('src/repositories/learningRepository.ts', edit_repo)

          def edit_database(s):
              marker = '''    this.version(3).stores({\n      questions: 'id, subject, unit, sourceType, questionFormat, importance, revision, *tags',\n      materials: 'id, subject, unit, importance, revision, *tags',\n      sources: 'source_id, source_group, answer_authority',\n      sourceOccurrences:\n        'source_occurrence_id, canonical_question_id, source_id, source_set_id, source_occurrence_order',\n      media: 'media_id, canonical_question_id, media_type, placement_after, display_order, source_id',\n      mediaBlobs: 'media_id',\n      learningHistory: 'questionId, lastResult, lastAnsweredAt, favorite',\n      materialHistory: 'materialId, lastViewedAt, favorite, viewed',\n      examSessions: 'id, startedAt, completedAt, completionReason',\n      meta: 'key'\n    });\n'''
              addition = marker + '''\n    this.version(4).stores({\n      questions: 'id, subject, unit, sourceType, questionFormat, importance, revision, *tags',\n      materials: 'id, subject, unit, importance, revision, *tags',\n      sources: 'source_id, source_group, answer_authority',\n      sourceOccurrences:\n        'source_occurrence_id, canonical_question_id, source_id, source_set_id, source_occurrence_order',\n      media: 'media_id, canonical_question_id, media_type, placement_after, display_order, source_id',\n      mediaBlobs: 'media_id',\n      learningHistory: 'questionId, lastResult, lastAnsweredAt',\n      materialHistory: 'materialId, lastViewedAt, viewed',\n      examSessions: 'id, startedAt, completedAt, completionReason',\n      meta: 'key'\n    });\n'''
              return repl(s, marker, addition, 'Dexie v4 favorite-index removal')
          edit('src/db/database.ts', edit_database)

          def edit_backup(s):
              s = repl(s, "export const LEARNING_STATE_BACKUP_VERSION = 1;\n", "export const LEARNING_STATE_BACKUP_VERSION = 2;\nconst LEGACY_LEARNING_STATE_BACKUP_VERSION = 1;\n", 'backup version')
              insert_after = "const learningResultSchema = z.enum(['correct', 'incorrect', 'uncertain']);\n"
              helper = '''\nfunction stripLegacyFavorite(value: unknown): unknown {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) return value;\n  const normalized = { ...(value as Record<string, unknown>) };\n  delete normalized.favorite;\n  return normalized;\n}\n'''
              s = repl(s, insert_after, insert_after + helper, 'backup legacy helper')
              old_learning = '''const learningHistorySchema = z\n  .object({\n    questionId: z.string().min(1),\n    attempts: z.number().int().nonnegative(),\n    correctCount: z.number().int().nonnegative(),\n    incorrectCount: z.number().int().nonnegative(),\n    uncertainCount: z.number().int().nonnegative(),\n    consecutiveCorrect: z.number().int().nonnegative(),\n    lastResult: learningResultSchema.nullable(),\n    lastAnsweredAt: z.string().datetime().nullable(),\n    favorite: z.boolean(),\n    needsReview: z.boolean().default(false)\n  })\n  .strict()\n  .superRefine((value, ctx) => {\n'''
              new_learning = '''const learningHistorySchema = z.preprocess(\n  stripLegacyFavorite,\n  z\n    .object({\n      questionId: z.string().min(1),\n      attempts: z.number().int().nonnegative(),\n      correctCount: z.number().int().nonnegative(),\n      incorrectCount: z.number().int().nonnegative(),\n      uncertainCount: z.number().int().nonnegative(),\n      consecutiveCorrect: z.number().int().nonnegative(),\n      lastResult: learningResultSchema.nullable(),\n      lastAnsweredAt: z.string().datetime().nullable(),\n      needsReview: z.boolean().default(false)\n    })\n    .strict()\n    .superRefine((value, ctx) => {\n'''
              s = repl(s, old_learning, new_learning, 'learning backup schema start')
              close_marker = '''    if ((value.attempts === 0) !== (value.lastResult === null)) {\n      ctx.addIssue({\n        code: 'custom',\n        message: '回答回数と直近回答結果の状態が一致しません。'\n      });\n    }\n  });\n\nconst materialHistorySchema = z\n  .object({\n    materialId: z.string().min(1),\n    favorite: z.boolean(),\n    viewed: z.boolean(),\n    lastViewedAt: z.string().datetime().nullable(),\n    scrollPosition: z.number().finite().nonnegative()\n  })\n  .strict();\n'''
              close_new = '''    if ((value.attempts === 0) !== (value.lastResult === null)) {\n      ctx.addIssue({\n        code: 'custom',\n        message: '回答回数と直近回答結果の状態が一致しません。'\n      });\n    }\n    })\n);\n\nconst materialHistorySchema = z.preprocess(\n  stripLegacyFavorite,\n  z\n    .object({\n      materialId: z.string().min(1),\n      viewed: z.boolean(),\n      lastViewedAt: z.string().datetime().nullable(),\n      scrollPosition: z.number().finite().nonnegative()\n    })\n    .strict()\n);\n'''
              s = repl(s, close_marker, close_new, 'backup schemas close/material')
              s = repl(s, '    formatVersion: z.literal(LEARNING_STATE_BACKUP_VERSION),\n', '    formatVersion: z.union([\n      z.literal(LEGACY_LEARNING_STATE_BACKUP_VERSION),\n      z.literal(LEARNING_STATE_BACKUP_VERSION)\n    ]),\n', 'backup version union')
              return s
          edit('src/services/learningStateBackupService.ts', edit_backup)

          edit('src/components/LearningStateBackupControls.tsx', lambda s: repl(
              s,
              '学習履歴・お気に入り・要復習・資料履歴・試験履歴だけを保存します。',
              '学習履歴・要復習・資料履歴・試験履歴だけを保存します。',
              'backup UI text'))

          print('Remaining active favorite references in src:')
          import subprocess
          subprocess.run(['git', 'grep', '-nE', 'favorite|お気に入り', '--', 'src'], check=False)
      - name: Commit favorite removal
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: remove favorite feature from learner flows"
          git push origin HEAD:hotfix/v0.20.1-remove-favorites
